<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Newsletter Studio — live demo</title>
<meta name="theme-color" content="#0f1126">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Studio">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root{--bg:#0f1126;--panel:#171a33;--line:#2a2f52;--ink:#e9eaf5;--mut:#9aa0c7;--accent:#FF2D86;--coral:#FF7A45;--ok:#3ad29f;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
  header{padding:22px 28px;padding-top:calc(env(safe-area-inset-top, 0px) + 18px);border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:19px;letter-spacing:-.01em}
  h1 span{color:var(--accent)}
  .sub{color:var(--mut);font-size:13px;margin-top:3px}
  main{max-width:1080px;margin:0 auto;padding:24px 28px}
  .hero{display:flex;gap:16px;flex-wrap:wrap;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 22px}
  .hero .lead{flex:1;min-width:260px}
  .hero .lead .t{font-size:16px;font-weight:700;color:var(--ink)}
  .hero .lead .d{color:var(--mut);font-size:13px;margin-top:4px}
  button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:13px 26px;font-size:15px;font-weight:700;cursor:pointer;white-space:nowrap}
  button:disabled{opacity:.55;cursor:default}
  /* Single-view "snake" flow: row 1 left->right, row 2 right->left, no side-scroll. */
  .flow{margin:30px 0 10px}
  .frow{display:flex;align-items:stretch;gap:0}
  .frow.r2{flex-direction:row-reverse}
  .turn{display:flex;justify-content:flex-end;color:var(--mut);font-size:18px;line-height:1;margin:7px 0;padding-right:6.5%}
  .node{flex:1 1 0;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 14px 12px;position:relative;transition:.2s;opacity:.5;overflow:hidden}
  .node .num{position:absolute;top:-11px;left:12px;width:22px;height:22px;border-radius:50%;background:var(--line);color:var(--ink);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}
  .node.active .num{background:var(--coral);color:#fff}
  .node.done .num{background:var(--ok);color:#06251a}
  .node .nl{font-weight:700;font-size:13px}
  .node .nl{overflow-wrap:anywhere}
  .node .nd{font-size:11px;color:var(--mut);margin-top:3px;min-height:30px;line-height:1.35;overflow-wrap:anywhere}
  .node .dot{position:absolute;top:13px;right:12px;width:8px;height:8px;border-radius:50%;background:var(--line)}
  .node.active{opacity:1;border-color:var(--coral);box-shadow:0 0 0 1px var(--coral),0 6px 20px rgba(255,122,69,.18)}
  .node.active .dot{background:var(--coral);animation:pulse 1s infinite}
  .node.done{opacity:1;border-color:var(--ok)}
  .node.done .dot{background:var(--ok)}
  .node.gate{border-style:dashed}
  .edge{flex:0 0 28px;align-self:center;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:15px}
  @media(max-width:760px){.frow{flex-wrap:wrap;gap:12px}.frow.r2{flex-direction:row}.node{flex:1 1 44%}.edge,.turn{display:none}}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:.5}}
  .result{margin-top:22px;display:none}
  .result.show{display:block}
  .cfg{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;font-size:13px;color:var(--mut);margin-bottom:14px}
  .cfg b{color:var(--ink)}
  .cfg a{color:var(--accent);text-decoration:none}
  iframe{width:100%;height:760px;border:1px solid var(--line);border-radius:12px;background:#fff}
</style></head><body>
<header><h1>Newsletter <span>Studio</span></h1><div class="sub">An AI agent researches, drafts, fact-checks, and renders a real newsletter issue &mdash; watch it run.</div></header>
<main>
  <div class="hero">
    <div class="lead">
      <div class="t">See the engine run</div>
      <div class="d">Watch the agentic pipeline work through a real issue &mdash; research &rarr; draft &rarr; fact-check &rarr; render. Instant, no signup.</div>
    </div>
    <button id="go">&#9654;&nbsp; See it run</button>
  </div>
  <div id="flow" class="flow"></div>
  <div id="result" class="result"><div id="cfg" class="cfg"></div><iframe id="frame" title="Sample newsletter issue"></iframe></div>
</main>
<script>
const NODES = [{"id": "brief", "label": "Brief", "detail": "Configuring for the audience"}, {"id": "research", "label": "Research", "detail": "Searching the web for fresh stories"}, {"id": "read", "label": "Read sources", "detail": "Fetching + reading the articles"}, {"id": "freshness", "label": "Freshness gate", "detail": "Dropping anything stale"}, {"id": "draft", "label": "Draft", "detail": "Writing the issue"}, {"id": "editor", "label": "Sr. Editor", "detail": "Fact-checking every claim against source"}, {"id": "render", "label": "Render", "detail": "Responsive, dark-mode, Outlook-safe email"}, {"id": "done", "label": "Done", "detail": "Ready for review"}];
const flow = document.getElementById('flow');
function paint(states){
  flow.innerHTML='';
  const rows=[[0,1,2,3],[4,5,6,7]];
  rows.forEach((idxs,ri)=>{
    const rowEl=document.createElement('div');
    rowEl.className='frow'+(ri===1?' r2':'');
    idxs.forEach((gi,ci)=>{
      const n=NODES[gi]; if(!n) return;
      const st=states[n.id];
      const el=document.createElement('div');
      el.className='node'+(n.id==='editor'?' gate':'')+(st?(' '+st.state):'');
      el.innerHTML='<div class="num">'+(gi+1)+'</div><div class="dot"></div><div class="nl">'+n.label+'</div><div class="nd">'+((st&&st.detail)||n.detail)+'</div>';
      rowEl.appendChild(el);
      if(ci<idxs.length-1){const e=document.createElement('div');e.className='edge';e.textContent=(ri===1?'←':'→');rowEl.appendChild(e);}
    });
    flow.appendChild(rowEl);
    if(ri===0){const t=document.createElement('div');t.className='turn';t.textContent='↓';flow.appendChild(t);}
  });
}
let states={}; paint(states);
const goBtn=document.getElementById('go');
const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));

// The sample issue is a real one this system shipped, baked into the static site
// (api/sample.json). No backend, no API key, no network generation — so nothing
// can silently fail. "See it run" animates the real pipeline stages client-side,
// then reveals the finished issue.
let SAMPLE=null;
fetch('api/sample.json').then(r=>r.json()).then(s=>{ if(s&&s.html) SAMPLE=s; }).catch(()=>{});

function revealSample(){
  const cfg=document.getElementById('cfg');
  if(SAMPLE&&SAMPLE.html){
    cfg.innerHTML='<b>The AI PM Brief</b> &middot; a real issue this engine produced end-to-end, human-reviewed before publishing. '
      +'<a href="https://github.com/jungdjh/newsletter-platform" target="_blank" rel="noopener">See how it works &rarr;</a>';
    document.getElementById('frame').srcdoc=SAMPLE.html;
  }else{
    cfg.innerHTML='<b>Sample issue unavailable right now.</b> <a href="https://github.com/jungdjh/newsletter-platform" target="_blank" rel="noopener">See how the engine works &rarr;</a>';
  }
  document.getElementById('result').classList.add('show');
}

async function playDemo(){
  goBtn.disabled=true; goBtn.textContent='Running…';
  states={}; paint(states);
  document.getElementById('result').classList.remove('show');
  for(const n of NODES){
    states[n.id]={state:'active',detail:n.detail}; paint(states);
    await sleep(n.id==='research'||n.id==='read'?720:430);
    states[n.id]={state:'done',detail:n.detail}; paint(states);
    await sleep(90);
  }
  revealSample();
  goBtn.disabled=false; goBtn.innerHTML='↺&nbsp; Replay';
  document.getElementById('result').scrollIntoView({behavior:'smooth',block:'nearest'});
}
goBtn.onclick=playDemo;

// Register the service worker so the home-screen icon installs + opens offline to the shell.
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script></body></html>
